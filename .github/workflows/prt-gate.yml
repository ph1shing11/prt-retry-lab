name: PRT-GATE
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  gate:
    if: contains(github.event.pull_request.labels.*.name, 'ok-to-test')
    runs-on: ubuntu-latest
    steps:
      - name: checkout PR head by mutable ref
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - name: context report
        env:
          LAB_MARKER: ${{ vars.LAB_MARKER }}
        run: |
          echo "ATTEMPT=${{ github.run_attempt }}"
          echo "EVENT=${{ github.event_name }}"
          echo "PINNED_GITHUB_SHA=$GITHUB_SHA"
          echo "CHECKED_OUT_SHA=$(git rev-parse HEAD)"
          echo "MARKER_LEN=${#LAB_MARKER}"
      - name: run contributor script
        env:
          LAB_MARKER: ${{ vars.LAB_MARKER }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: bash ./ci/run.sh
