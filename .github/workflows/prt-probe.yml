name: PRT-PROBE
on:
  pull_request_target:
    types: [labeled]
permissions:
  contents: read
  pull-requests: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: A explicit fork repository plus head ref
        id: a
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          ref: ${{ github.event.pull_request.head.ref }}
          path: a
          persist-credentials: false
      - name: B refs/pull/N/head on the base repository
        id: b
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/head
          path: b
          persist-credentials: false
      - name: C refs/pull/N/merge on the base repository
        id: c
        continue-on-error: true
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: c
          persist-credentials: false
      - name: D raw git fetch, no action involved
        id: d
        continue-on-error: true
        run: |
          mkdir d && cd d && git init -q
          git remote add origin "https://github.com/${{ github.repository }}.git"
          git fetch -q --depth=1 origin "refs/pull/${{ github.event.pull_request.number }}/head"
          git checkout -q FETCH_HEAD
          echo "D_SHA=$(git rev-parse HEAD)"
      - name: report
        env:
          LAB_MARKER: ${{ vars.LAB_MARKER }}
        run: |
          echo "OUTCOME A=${{ steps.a.outcome }} B=${{ steps.b.outcome }} C=${{ steps.c.outcome }} D=${{ steps.d.outcome }}"
          for p in a b c d; do
            if [ -d "$p" ]; then echo "$p SHA=$(git -C "$p" rev-parse HEAD 2>/dev/null || echo none)"; else echo "$p ABSENT"; fi
          done
          echo "MARKER_LEN=${#LAB_MARKER}"
          echo "PINNED_GITHUB_SHA=$GITHUB_SHA"
